# Configuration for probot-stale - https://github.com/probot/stale

# Number of days of inactivity before an issue becomes stale
daysUntilStale: 30

# Number of days of inactivity before a stale issue is closed
daysUntilClose: 7

# Only issues or pull requests with all of these labels are checked if stale.
# Defaults to `[]` (disabled).
onlyLabels: []

# Issues or pull requests with these labels will never be considered stale.
exemptLabels:
  - "pinned"
  - "security"
  - "bug"
  - "enhancement"

# Set to true to ignore issues in a milestone (or multiple milestones)
exemptMilestones: false

# Set to true to ignore issues with an assignee
exemptAssignees: false

# Label to use when marking as stale
staleLabel: "stale"

# Comment to post when marking as stale. Set to `false` to disable
markComment: >
  This issue has been automatically marked as stale because it has not had
  recent activity. It will be closed if no further activity occurs. Thank you
  for your contributions.
  
  **⚠️ If you're using an outdated version, please update first!**
  ```
  cd ComfyUI/custom_nodes/ComfyUI-WhisperCPP
  git pull
  pip install -r requirements.txt
  ```

# Comment to post when closing a stale issue. Set to `false` to disable
closeComment: false

# Limit the number of actions per hour
limitPerRun: 10
