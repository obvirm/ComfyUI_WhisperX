name: Comfy-Action Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python
        run: |
          uv python install 3.11
          uv python pin 3.11
          uv venv .venv --python 3.11
          source .venv/bin/activate

      - name: Clone ComfyUI
        run: |
          git clone --depth 1 https://github.com/comfyanonymous/ComfyUI.git ComfyUI

      - name: Install ComfyUI dependencies
        run: |
          source .venv/bin/activate
          cd ComfyUI
          uv pip install -r requirements.txt

      - name: Install custom node
        run: |
          source .venv/bin/activate
          mkdir -p ComfyUI/custom_nodes/ComfyUI-WhisperCPP
          rsync -av --exclude='ComfyUI' --exclude='.git' --exclude='*.exe' . ComfyUI/custom_nodes/ComfyUI-WhisperCPP/
          cd ComfyUI/custom_nodes/ComfyUI-WhisperCPP
          uv pip install -r requirements.txt --system || true

      - name: Download test audio
        run: |
          mkdir -p ComfyUI/input
          curl -L -o ComfyUI/input/test.mp3 "https://data.freetouse.com/music/tracks/f6a131e6-388d-f4d1-e784-04aeba2896ff/file/mp3"
          ls -la ComfyUI/input/test.mp3

      - name: Start ComfyUI
        run: |
          source .venv/bin/activate
          cd ComfyUI
          python main.py --cpu > application.log 2>&1 &
          echo $! > .comfyui.pid
          echo "ComfyUI PID: $(cat .comfyui.pid)"
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8188/system_stats > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            echo "Waiting for server... ${i}s"
            sleep 5
          done
          curl -s http://127.0.0.1:8188/system_stats || echo "Server not ready after 150s"

      - name: Check server
        run: |
          echo "=== ComfyUI Log ==="
          cat ComfyUI/application.log || echo "No log"
          echo "=== Process check ==="
          ps aux | grep main.py | grep -v grep || echo "No main.py process"
          curl -s http://127.0.0.1:8188/system_stats || echo "Server not responding"

      - name: Run stress_test workflow
        if: always()
        run: |
          source .venv/bin/activate
          cd ComfyUI
          python -c "
          import json, urllib.request, time
          
          # Load test workflow
          with open('../workflows/test.json') as f:
              workflow = json.load(f)
          
          # Queue prompt
          data = json.dumps({'prompt': workflow}).encode()
          req = urllib.request.Request('http://127.0.0.1:8188/prompt', data=data, headers={'Content-Type': 'application/json'})
          try:
              resp = urllib.request.urlopen(req)
              print(f'Prompt queued: {resp.read().decode()}')
          except Exception as e:
              print(f'Error: {e}')
          " 2>&1 || echo "Workflow test skipped"

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comfyui-logs
          path: |
            ComfyUI/application.log
            ComfyUI/comfyui.log
