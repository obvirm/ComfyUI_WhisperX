name: Comfy-Action Test (macOS)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.11 && uv python pin 3.11 && uv venv .venv --python 3.11
      - run: git clone --depth 1 https://github.com/comfyanonymous/ComfyUI.git ComfyUI
      - run: |
          source .venv/bin/activate
          uv pip install -r ComfyUI/requirements.txt
          mkdir -p ComfyUI/custom_nodes/ComfyUI-WhisperCPP
          rsync -av --exclude=ComfyUI --exclude=.venv --exclude=.git . ComfyUI/custom_nodes/ComfyUI-WhisperCPP/
          cd ComfyUI/custom_nodes/ComfyUI-WhisperCPP
          uv pip install -r requirements.txt
      - run: |
          mkdir -p ComfyUI/input
          curl -L -o ComfyUI/input/test.mp3 "https://data.freetouse.com/music/tracks/f6a131e6-388d-f4d1-e784-04aeba2896ff/file/mp3"
      - run: |
          source .venv/bin/activate
          cd ComfyUI
          python main.py --cpu > application.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8188/system_stats > /dev/null 2>&1; then echo "Server ready"; break; fi
            sleep 5
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comfyui-logs-macos
          path: ComfyUI/application.log
