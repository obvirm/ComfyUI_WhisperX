name: Comfy-Action Test (Windows)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.11 && uv python pin 3.11 && uv venv .venv --python 3.11
      - run: git clone --depth 1 https://github.com/comfyanonymous/ComfyUI.git ComfyUI
      - run: |
          uv pip install -r ComfyUI/requirements.txt
          mkdir -p ComfyUI/custom_nodes/ComfyUI-WhisperCPP
          robocopy . ComfyUI/custom_nodes/ComfyUI-WhisperCPP /E /NP /NDL /NFL /NJH /NJS /XF *.exe >nul 2>&1 || true
          uv pip install -r ComfyUI/custom_nodes/ComfyUI-WhisperCPP/requirements.txt
          uv pip install sherpa-onnx
      - run: |
          mkdir -p ComfyUI/input
          curl.exe -L -o ComfyUI/input/test.mp3 "https://data.freetouse.com/music/tracks/f6a131e6-388d-f4d1-e784-04aeba2896ff/file/mp3"
      - run: |
          cd ComfyUI
          python main.py --cpu > application.log 2>&1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comfyui-logs-windows
          path: ComfyUI/application.log
