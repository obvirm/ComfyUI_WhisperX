name: Test ComfyUI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: '[Unix] Checkout'
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: '[Unix] Install uv'
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: '[Unix] Setup Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: '[Unix] Install ComfyUI'
        run: |
          git clone --depth 1 https://github.com/comfyanonymous/ComfyUI.git
          cd ComfyUI
          uv pip install -r requirements.txt --system

      - name: '[Unix] Install custom node'
        run: |
          mkdir -p ComfyUI/custom_nodes/ComfyUI-WhisperCPP
          rsync -av --exclude='ComfyUI' /home/runner/work/ComfyUI-WhisperCPP/ComfyUI-WhisperCPP/ ComfyUI/custom_nodes/ComfyUI-WhisperCPP/
          cd ComfyUI/custom_nodes/ComfyUI-WhisperCPP
          uv pip install -r requirements.txt --system

      - name: '[Unix] Test node import'
        run: |
          cd ComfyUI/custom_nodes/ComfyUI-WhisperCPP
          python -c "
          import sys
          sys.path.insert(0, '.')
          # Test core modules directly
          from whispercpp.auto_download import _get_version
          from whispercpp.gpu_detect import detect_gpu
          print(f'Version: {_get_version()}')
          gpu = detect_gpu()
          print(f'GPU: {gpu["backend"]}')
          
          # Test WhisperCPP (may fail without DLLs)
          try:
              from whispercpp.whisper_lib import WhisperCPP
              wcpp = WhisperCPP()
              print(f'WhisperCPP: lock={type(wcpp._lock).__name__}')
          except Exception as e:
              print(f'WhisperCPP: expected error (no DLLs): {type(e).__name__}')
          
          # Test cppannote (may fail without DLLs)
          try:
              from whispercpp.ext.cppannote import segment, diarize
              print('cppannote: imported')
          except Exception as e:
              print(f'cppannote: expected error (no DLLs): {type(e).__name__}')
          
          print('Core module tests passed!')
          "

      - name: '[Unix] Test WhisperCPP import'
        run: |
          cd ComfyUI/custom_nodes/ComfyUI-WhisperCPP
          python -c "
          import sys
          sys.path.insert(0, '.')
          from whispercpp.auto_download import _get_version
          from whispercpp.gpu_detect import detect_gpu
          from whispercpp.whisper_lib import WhisperCPP
          print(f'Version: {_get_version()}')
          gpu = detect_gpu()
          print(f'GPU: {gpu[\"backend\"]}')
          wcpp = WhisperCPP()
          print(f'WhisperCPP created, lock: {type(wcpp._lock).__name__}')
          print('All imports successful!')
          "

      - name: '[Unix] Upload artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ComfyUI/output/
