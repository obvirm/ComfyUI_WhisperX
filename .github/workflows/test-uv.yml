name: Test ComfyUI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: '[Unix] Checkout'
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: '[Unix] Install uv'
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: '[Unix] Setup Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: '[Unix] Install ComfyUI'
        run: |
          git clone https://github.com/comfyanonymous/ComfyUI.git
          cd ComfyUI
          uv pip install -r requirements.txt --system

      - name: '[Unix] Install custom node'
        run: |
          cd ComfyUI/custom_nodes
          ln -s $GITHUB_WORKSPACE ComfyUI-WhisperCPP
          cd ComfyUI-WhisperCPP
          uv pip install -r requirements.txt --system

      - name: '[Unix] Run ComfyUI'
        run: |
          cd ComfyUI
          python main.py --cpu --dont-print-server &
          sleep 10

      - name: '[Unix] Test workflow'
        run: |
          cd ComfyUI
          python -c "
          import sys
          sys.path.insert(0, '.')
          sys.path.insert(0, 'custom_nodes')
          from ComfyUI_WhisperCPP import WhisperCPPNode
          print('Node loaded successfully!')
          node = WhisperCPPNode()
          print(f'Node class: {node.__class__.__name__}')
          "

      - name: '[Unix] Upload artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ComfyUI/output/
