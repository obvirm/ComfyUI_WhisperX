name: Test ComfyUI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: '[Unix] Checkout'
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: '[Unix] Install uv'
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: '[Unix] Setup Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: '[Unix] Install ComfyUI'
        run: |
          git clone --depth 1 https://github.com/comfyanonymous/ComfyUI.git
          cd ComfyUI
          uv pip install -r requirements.txt --system

      - name: '[Unix] Install custom node'
        run: |
          mkdir -p ComfyUI/custom_nodes/ComfyUI-WhisperCPP
          rsync -av --exclude='ComfyUI' /home/runner/work/ComfyUI-WhisperCPP/ComfyUI-WhisperCPP/ ComfyUI/custom_nodes/ComfyUI-WhisperCPP/
          cd ComfyUI/custom_nodes/ComfyUI-WhisperCPP
          uv pip install -r requirements.txt --system

      - name: '[Unix] Test node import'
        run: |
          cd ComfyUI/custom_nodes/ComfyUI-WhisperCPP
          python -c "
          import sys
          sys.path.insert(0, '.')
          results = []
          
          # Test 1: auto_download
          try:
              from whispercpp.auto_download import _get_version
              v = _get_version()
              results.append(f'auto_download: OK (v{v})')
          except Exception as e:
              results.append(f'auto_download: FAIL ({type(e).__name__})')
          
          # Test 2: gpu_detect
          try:
              from whispercpp.gpu_detect import detect_gpu
              gpu = detect_gpu()
              results.append(f'gpu_detect: OK (backend={gpu.get("backend", "unknown")})')
          except Exception as e:
              results.append(f'gpu_detect: FAIL ({type(e).__name__})')
          
          # Test 3: whisper_lib
          try:
              from whispercpp.whisper_lib import WhisperCPP
              wcpp = WhisperCPP()
              results.append(f'whisper_lib: OK')
          except Exception as e:
              results.append(f'whisper_lib: EXPECTED FAIL ({type(e).__name__})')
          
          # Test 4: cppannote
          try:
              from whispercpp.ext.cppannote import segment
              results.append(f'cppannote: OK')
          except Exception as e:
              results.append(f'cppannote: EXPECTED FAIL ({type(e).__name__})')
          
          # Print results
          for r in results:
              print(r)
          
          # All core module tests pass if we get here
          print('Core module tests completed!')
          "

      - name: '[Unix] Test WhisperCPP import'
        run: |
          cd ComfyUI/custom_nodes/ComfyUI-WhisperCPP
          python -c "
          import sys
          sys.path.insert(0, '.')
          from whispercpp.auto_download import _get_version
          from whispercpp.gpu_detect import detect_gpu
          from whispercpp.whisper_lib import WhisperCPP
          print(f'Version: {_get_version()}')
          gpu = detect_gpu()
          print(f'GPU: {gpu[\"backend\"]}')
          wcpp = WhisperCPP()
          print(f'WhisperCPP created, lock: {type(wcpp._lock).__name__}')
          print('All imports successful!')
          "

      - name: '[Unix] Upload artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ComfyUI/output/
