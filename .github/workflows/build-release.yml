name: Build & Release DLLs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # whisper.cpp — Vulkan + OpenCL + CPU
      - name: Build whisper.cpp
        run: python build_whisper_cpp.py

      # BSRoformer — CUDA if nvidia-smi available
      - name: Build BSRoformer
        shell: bash
        run: |
          if command -v nvidia-smi &>/dev/null; then
            echo "CUDA detected, building with --cuda"
            python build_bs_roformer.py --cuda
          else
            echo "No CUDA, building CPU only"
            python build_bs_roformer.py
          fi

      # cpp-annote
      - name: Build cpp-annote
        shell: cmd
        run: build_cpp_annote_dll.bat

      # Package
      - name: Collect DLLs
        shell: bash
        run: |
          mkdir -p release
          cp whisper.dll ggml-base.dll ggml-cpu.dll ggml-opencl.dll ggml-vulkan.dll ggml.dll release/
          cp bs_roformer.dll release/
          cp cpp_annote.dll onnxruntime.dll onnxruntime_providers_shared.dll release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dlls
          path: release/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcl-dev libvulkan-dev

      - name: Build whisper.cpp
        run: python build_whisper_cpp.py

      - name: Build BSRoformer
        run: python build_bs_roformer.py

      - name: Collect .so
        run: |
          mkdir -p release
          find . -name "libwhisper.so*" -exec cp {} release/ \;
          find . -name "libbs_roformer.so*" -exec cp {} release/ \;
          find . -name "libggml*.so*" -exec cp {} release/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-so
          path: release/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build whisper.cpp
        run: python build_whisper_cpp.py

      - name: Build BSRoformer
        run: python build_bs_roformer.py

      - name: Collect dylib
        run: |
          mkdir -p release
          find . -name "libwhisper.dylib*" -exec cp {} release/ \;
          find . -name "libbs_roformer.dylib*" -exec cp {} release/ \;
          find . -name "libggml*.dylib*" -exec cp {} release/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dylib
          path: release/

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-dlls/*
            linux-so/*
            macos-dylib/*
          generate_release_notes: true
