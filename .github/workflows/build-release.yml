name: Build & Release DLLs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v2.1.1)'
        required: true
        default: 'v2.1.1'

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # whisper.cpp — Vulkan + OpenCL + CPU
      - name: Build whisper.cpp
        run: python build_whisper_cpp.py --native OFF

      # BSRoformer — CPU only (no GPU SDKs in CI)
      - name: Build BSRoformer
        run: python build_bs_roformer.py

      # cpp-annote
      - name: Install zlib (for cnpy)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install zlib:x64-windows
          echo "ZLIB_ROOT=C:/vcpkg/installed/x64-windows" >> $GITHUB_ENV
          echo "ZLIB_INCLUDE_DIR=C:/vcpkg/installed/x64-windows/include" >> $GITHUB_ENV
          echo "ZLIB_LIBRARY=C:/vcpkg/installed/x64-windows/lib/zlib.lib" >> $GITHUB_ENV

      - name: Build cpp-annote
        run: python build_cpp_annote.py

      # Package
      - name: Collect DLLs
        shell: bash
        run: |
          mkdir -p release
          # Copy whisper DLLs from root + build output
          for f in whisper.dll ggml-base.dll ggml-cpu.dll ggml-opencl.dll ggml-vulkan.dll ggml.dll; do
            cp "$f" release/ 2>/dev/null || true
            cp "whisper.cpp/build/bin/Release/$f" release/ 2>/dev/null || true
            cp "whisper.cpp/build/bin/$f" release/ 2>/dev/null || true
            cp "whisper.cpp/build/$f" release/ 2>/dev/null || true
          done
          cp bs_roformer.dll release/ 2>/dev/null || true
          cp bs_roformer.cpp/build/Release/bs_roformer.dll release/ 2>/dev/null || true
          cp bs_roformer.cpp/build/bs_roformer.dll release/ 2>/dev/null || true
          cp cpp_annote.dll release/ 2>/dev/null || true
          cp cpp-annote/build/Release/cpp_annote.dll release/ 2>/dev/null || true
          cp cpp-annote/build/cpp_annote.dll release/ 2>/dev/null || true
          # Copy all ONNX Runtime DLLs (CPU + CUDA)
          cp onnxruntime*.dll release/ 2>/dev/null || true
          cp cpp-annote/onnxruntime*/lib/onnxruntime*.dll release/ 2>/dev/null || true
          # Copy vcpkg dependency DLLs (zlib, etc.)
          cp "C:/vcpkg/installed/x64-windows/bin/zlib*.dll" release/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dlls
          path: release/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ocl-icd-opencl-dev libvulkan-dev opencl-headers

      - name: Build whisper.cpp
        run: python build_whisper_cpp.py --native OFF

      - name: Build BSRoformer
        run: python build_bs_roformer.py

      - name: Build cpp-annote%
        run: python build_cpp_annote.py

      - name: Collect .so
        run: |
          mkdir -p release
          # Find all .so* including versioned SONAMES, copy content (follow symlinks)
          find whisper.cpp/build -name "libggml*.so*" -exec cp -L {} release/ \;
          find whisper.cpp/build -name "libwhisper.so*" -exec cp -L {} release/ \;
          find bs_roformer.cpp/build -name "libbs_roformer.so*" -exec cp -L {} release/ \;
          find bs_roformer.cpp/build -name "libggml*.so*" -exec cp -L {} release/ \;
          find cpp-annote/build -name "libcpp_annote.so*" -exec cp -L {} release/ \;
          find cpp-annote -path "*/onnxruntime-*/lib/*.so*" -exec cp -L {} release/ \;
          ls -la release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-so
          path: release/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build whisper.cpp
        run: python build_whisper_cpp.py --native OFF

      - name: Build BSRoformer
        run: python build_bs_roformer.py

      - name: Build cpp-annote
        run: python build_cpp_annote.py

      - name: Collect dylib
        run: |
          mkdir -p release
          find . -name "libwhisper.dylib*" -exec cp {} release/ \;
          find . -name "libbs_roformer.dylib*" -exec cp {} release/ \;
          find . -name "libcpp_annote.dylib*" -exec cp {} release/ \;
          find . -name "libggml*.dylib*" -exec cp {} release/ \;
          find cpp-annote -path "*/onnxruntime-*/lib/*.dylib*" -exec cp {} release/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dylib
          path: release/

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            windows-dlls/*
            linux-so/*
            macos-dylib/*
            cpp-annote/artifacts/*.onnx
          generate_release_notes: true

